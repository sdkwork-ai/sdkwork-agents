apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdkwork-api-agents-standalone-gateway
  labels:
    app.kubernetes.io/name: sdkwork-agents
    app.kubernetes.io/component: standalone-gateway
spec:
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sdkwork-agents
      app.kubernetes.io/component: standalone-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdkwork-agents
        app.kubernetes.io/component: standalone-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8095"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sdkwork-agents
              app.kubernetes.io/component: standalone-gateway
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sdkwork-agents
              app.kubernetes.io/component: standalone-gateway
      containers:
        - name: standalone-gateway
          image: registry.sdkwork.com/apps/sdkwork-agents:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8095
          envFrom:
            - configMapRef:
                name: sdkwork-agents-config
            - secretRef:
                name: sdkwork-agents-secrets
          env:
            - name: SDKWORK_NODE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            # Cluster replicas hold no local CLI provider state (Codex /
            # Claude Code sessions live on a developer workstation), so cloud
            # turns must route to a sandbox session or a remote engine. The
            # sandbox route fails closed when no sandbox port is assembled.
            - name: SDKWORK_AGENTS_TURN_EXECUTION_ROUTE
              value: sandbox
            # Structured logs for the cluster log collector.
            - name: SDKWORK_LOG_FORMAT
              value: json
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 3
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 256Mi
