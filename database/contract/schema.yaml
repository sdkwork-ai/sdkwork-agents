schema_version: 1
kind: sdkwork.database.schema
database_role: authoritative-server
module_id: agents
contract_version: 7.3.0
owner_team: agents-platform
compliance_level: L2
engines:
  - postgres
table_prefix: ai_
ddl_authority: ddl/baseline/postgres/0001_agents_baseline.sql
write_owner: sdkwork-intelligence-agents-service
tables:
  - name: ai_agent
    profile: tenant_entity
    lifecycle_status: active
    owner: agents-platform
    description: Managed agent identity, manifest, and lifecycle.
  - name: ai_agent_runtime_binding
    profile: tenant_entity
    lifecycle_status: active
    owner: agents-platform
    description: Agent-level provider configuration binding.
  - name: ai_agent_composition_slot
    profile: relation_entity
    lifecycle_status: active
    owner: agents-platform
    description: Agent references to sibling-owned capability resources.
    composition_contract:
      slot_kinds: [memory, knowledge, skill, prompt, drive, document, tool, mcp]
      target_modules: [memory, knowledgebase, skills, prompts, drive, documents, tools, mcp]
      canonical_pairs:
        - [memory, memory]
        - [knowledge, knowledgebase]
        - [skill, skills]
        - [prompt, prompts]
        - [drive, drive]
        - [document, documents]
        - [tool, tools]
        - [mcp, mcp]
  - name: ai_agent_audit_event
    profile: audit_event
    lifecycle_status: active
    owner: agents-platform
    description: Immutable, sanitized Agents aggregate audit facts.
  - name: ai_agent_runtime_execution
    profile: tenant_entity
    lifecycle_status: active
    owner: agents-platform
    description: Durable structured agent-call execution records (request payload, output payload, terminal status).
  - name: ai_agent_version
    profile: tenant_entity
    lifecycle_status: active
    owner: agents-platform
    description: Immutable agent version snapshots with activation markers.
  - name: ai_agent_webhook_subscription
    profile: tenant_entity
    lifecycle_status: active
    owner: agents-platform
    description: HTTPS webhook endpoints bound to agent event types, with HMAC signing secrets.
  - name: ai_agent_webhook_delivery
    profile: tenant_entity
    lifecycle_status: active
    owner: agents-platform
    description: Per-attempt webhook delivery ledger (payload, signature, response code, terminal status).
  - name: ai_agent_workspace
    profile: tenant_entity
    lifecycle_status: active
    owner: agents-platform
    description: User-owned project container with one active default per owner scope.
  - name: ai_agent_project
    profile: tenant_entity
    lifecycle_status: active
    owner: agents-platform
    description: Workspace-scoped reusable orchestration project and access-policy aggregate.
  - name: ai_agent_project_composition_slot
    profile: relation_entity
    lifecycle_status: active
    owner: agents-platform
    description: Project references to sibling-owned capability resources.
    composition_contract:
      slot_kinds: [memory, knowledge, skill, prompt, drive, document, tool, mcp]
      target_modules: [memory, knowledgebase, skills, prompts, drive, documents, tools, mcp]
      canonical_pairs:
        - [memory, memory]
        - [knowledge, knowledgebase]
        - [skill, skills]
        - [prompt, prompts]
        - [drive, drive]
        - [document, documents]
        - [tool, tools]
        - [mcp, mcp]
  - name: ai_agent_session
    profile: tenant_entity
    lifecycle_status: active
    owner: agents-platform
    description: Single durable agent execution session system of record with provider- or user-owned title authority.
  - name: ai_agent_session_runtime_binding
    profile: tenant_entity
    lifecycle_status: active
    owner: agents-platform
    description: Selected runtime, owner-scoped provider Session lineage, provider directory snapshot for title and provider-native ordering, and runtime-location reference for a session.
  - name: ai_agent_execution_host
    profile: operational_state
    lifecycle_status: active
    owner: agents-platform
    description: Dispatchable execution host registry (docker, micro VM, bare metal, kernel cloud-sandbox pool) with host kind, opaque dispatch endpoint, region, capacity, and lifecycle status for scheduler eligibility.
  - name: ai_agent_session_execution_placement
    profile: operational_state
    lifecycle_status: active
    owner: agents-platform
    description: Durable per-session execution placement binding with requested/effective execution target, pinned host, opaque kernel placement reference, placement lifecycle state, and bounded lease/fencing evidence.
  - name: ai_agent_turn
    profile: operational_state
    lifecycle_status: active
    owner: agents-platform
    description: Idempotent turn execution, retry, lease, fencing, usage, and terminal state.
  - name: ai_agent_turn_input_queue_entry
    profile: operational_state
    lifecycle_status: active
    owner: agents-platform
    description: Durable owner-scoped FIFO input awaiting exactly-once Turn execution with lease and fencing controls.
  - name: ai_agent_session_item
    profile: tenant_entity
    lifecycle_status: active
    owner: agents-platform
    description: Ordered typed transcript or execution item owned by a session.
  - name: ai_agent_item_drive_ref
    profile: relation_entity
    lifecycle_status: active
    owner: agents-platform
    description: Typed relation from a session item to Drive-owned resources.
  - name: ai_agent_item_feedback
    profile: user_entity
    lifecycle_status: active
    owner: agents-platform
    description: Per-user quality feedback for an assistant-output item.
  - name: ai_agent_interaction
    profile: operational_state
    lifecycle_status: active
    owner: agents-platform
    description: Typed approval, user-question, elicitation, or setup pause point with claim fencing and a bounded provider-neutral request envelope.
  - name: ai_agent_session_checkpoint
    profile: operational_state
    lifecycle_status: active
    owner: agents-platform
    description: Resumable provider or Drive-backed execution checkpoint reference.
  - name: ai_agent_task
    profile: operational_state
    lifecycle_status: active
    owner: agents-platform
    description: Versioned one-time or cron schedule bound to a persisted Agent Session.
  - name: ai_agent_task_run
    profile: operational_state
    lifecycle_status: active
    owner: agents-platform
    description: One logical scheduled, manual, or business-retry occurrence with Turn identity, lease, and fencing state.
  - name: ai_agent_task_run_attempt
    profile: operational_state
    lifecycle_status: active
    owner: agents-platform
    description: One infrastructure delivery attempt with worker, lease hash, fencing, and bounded diagnostics.
  - name: ai_agent_resource_user_state
    profile: user_entity
    lifecycle_status: active
    owner: agents-platform
    description: Per-user view preferences for an Agents session or project.
  - name: ai_agent_project_member
    profile: relation_entity
    lifecycle_status: active
    owner: agents-platform
    description: Agents project collaboration ACL.
  - name: ai_agent_share_link
    profile: tenant_entity
    lifecycle_status: active
    owner: agents-platform
    description: Hashed, revocable, expiring project or session grant.
  - name: ai_agent_outbox_event
    profile: outbox_event
    lifecycle_status: active
    owner: agents-platform
    description: Reliable Agents aggregate event publication.
  - name: ai_agent_model_configuration_profile
    profile: agent_model_configuration
    lifecycle_status: active
    owner: agents-platform
    description: Owner-scoped applied model configuration profile persisted for
      the runtime facade (tenant/organization/owner columns enforced by DDL and
      the scoped store surface).
  - name: ai_agent_tool_configuration
    profile: tenant_entity
    lifecycle_status: active
    owner: agents-platform
    description: Admin-managed per-tenant media tool configuration (enabled,
      save-to-drive default, default arguments).
  - name: ai_agent_tool_asset
    profile: user_entity
    lifecycle_status: active
    owner: agents-platform
    description: Generated media asset persisted to Drive outside a session-item
      context with the drive node as the storage authority.
external_references:
  - module: sdkwork-memory
    columns: [target_ref, target_version_ref]
  - module: sdkwork-knowledgebase
    columns: [target_ref, target_version_ref]
  - module: sdkwork-skills
    columns: [target_ref, target_version_ref]
  - module: sdkwork-prompts
    columns: [target_ref, target_version_ref]
  - module: sdkwork-documents
    columns: [target_ref, target_version_ref]
  - module: sdkwork-mcp
    columns: [target_ref, target_version_ref]
  - module: sdkwork-drive
    columns: [drive_space_id, drive_node_id, media_resource_id, object_blob_id]
