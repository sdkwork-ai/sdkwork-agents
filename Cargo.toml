[workspace]
resolver = "2"
members = [
    "crates/sdkwork-api-agents-assembly",
    "crates/sdkwork-agents-contract",
    "crates/sdkwork-intelligence-agents-service",
    "crates/sdkwork-routes-agents-http-shared",
    "crates/sdkwork-routes-agents-open-api",
    "crates/sdkwork-routes-agents-app-api",
    "crates/sdkwork-routes-agents-backend-api",
    "crates/sdkwork-agents-runtime-facade",
    "crates/sdkwork-agents-kernel-bridge",
    "crates/sdkwork-agents-database-host",
    "crates/sdkwork-api-agents-standalone-gateway",
    "crates/sdkwork-intelligence-agents-worker",
    "crates/sdkwork-agents-integration-tests",
    "crates/sdkwork-agents-tool-contract",
    "crates/sdkwork-agents-tool-cloudrouter",
    "crates/sdkwork-agents-tool-audio",
    "crates/sdkwork-agents-tool-video",
    "crates/sdkwork-agents-tool-music",
    "crates/sdkwork-agents-tool-sound-effect",
    "crates/sdkwork-agents-tool-image",
    "crates/sdkwork-agents-tool-file",
    "crates/sdkwork-agents-tool-intelligence",
    "crates/sdkwork-agents-tool-generations",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
if-addrs = "0.15"
dotenvy = "0.15"
http = "1"
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "time"] }
time = { version = "0.3", features = ["parsing"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"
async-trait = "0.1"
thiserror = "1"

# sdkwork-kernel runtime (SPI only — no application domain logic)
sdkwork-agent-kernel = { path = "../sdkwork-kernel/sdkwork-agent-kernel" }
sdkwork-code-kernel = { path = "../sdkwork-kernel/sdkwork-code-kernel" }
sdkwork-agent-server = { path = "../sdkwork-kernel/sdkwork-agent-server" }
sdkwork-agent-provider-spi = { path = "../sdkwork-kernel/sdkwork-agent-provider-spi" }
sdkwork-agent-provider-core = { path = "../sdkwork-kernel/sdkwork-kernel-plugins/crates/sdkwork-agent-provider-core" }
sdkwork-agent-provider-codex = { path = "../sdkwork-kernel/agent-providers/crates/sdkwork-agent-provider-codex" }
sdkwork-agent-provider-claude-code = { path = "../sdkwork-kernel/agent-providers/crates/sdkwork-agent-provider-claude-code" }
sdkwork-agent-provider-gemini-cli = { path = "../sdkwork-kernel/agent-providers/crates/sdkwork-agent-provider-gemini-cli" }
sdkwork-agent-provider-opencode = { path = "../sdkwork-kernel/agent-providers/crates/sdkwork-agent-provider-opencode" }
sdkwork-agent-provider-openclaw = { path = "../sdkwork-kernel/agent-providers/crates/sdkwork-agent-provider-openclaw" }
sdkwork-agent-provider-hermes = { path = "../sdkwork-kernel/agent-providers/crates/sdkwork-agent-provider-hermes" }
sdkwork-agent-provider-mimo-code = { path = "../sdkwork-kernel/agent-providers/crates/sdkwork-agent-provider-mimo-code" }
sdkwork-agent-provider-rig = { path = "../sdkwork-kernel/agent-providers/crates/sdkwork-agent-provider-rig", features = ["rig-core-adapter"] }

# Platform frameworks
sdkwork-web-core = { path = "../sdkwork-web-framework/crates/sdkwork-web-core" }
sdkwork-web-axum = { path = "../sdkwork-web-framework/crates/sdkwork-web-axum" }
sdkwork-web-contract = { path = "../sdkwork-web-framework/crates/sdkwork-web-contract" }
sdkwork-web-bootstrap = { path = "../sdkwork-web-framework/crates/sdkwork-web-bootstrap" }
sdkwork-iam-web-adapter = { path = "../sdkwork-iam/crates/sdkwork-iam-web-adapter" }
sdkwork-iam-database-host = { path = "../sdkwork-iam/crates/sdkwork-iam-database-host" }
sdkwork-iam-embedded-application-bootstrap = { path = "../sdkwork-iam/crates/sdkwork-iam-embedded-application-bootstrap" }
sdkwork-routes-iam-app-api = { path = "../sdkwork-iam/crates/sdkwork-routes-iam-app-api" }
# sdkwork-assets catalog + sdkwork-drive storage/uploader mounted same-origin by the standalone gateway
sdkwork-api-assets-assembly = { path = "../sdkwork-assets/crates/sdkwork-api-assets-assembly" }
sdkwork-api-drive-assembly = { path = "../sdkwork-drive/crates/sdkwork-api-drive-assembly" }
sdkwork-routes-drive-app-api = { path = "../sdkwork-drive/crates/sdkwork-routes-drive-app-api" }
sdkwork-drive-uploader-service = { path = "../sdkwork-drive/crates/sdkwork-drive-uploader-service" }
sdkwork-drive-object-runtime = { path = "../sdkwork-drive/crates/sdkwork-drive-object-runtime" }
sdkwork-drive-workspace-service = { path = "../sdkwork-drive/crates/sdkwork-drive-workspace-service" }
sdkwork-drive-storage-contract = { path = "../sdkwork-drive/crates/sdkwork-drive-storage-contract" }
reqwest = { version = "0.12", features = ["json", "stream"] }
sdkwork-database-config = { path = "../sdkwork-database/crates/sdkwork-database-config" }
sdkwork-database-sqlx = { path = "../sdkwork-database/crates/sdkwork-database-sqlx" }
sdkwork-database-lifecycle = { path = "../sdkwork-database/crates/sdkwork-database-lifecycle" }
sdkwork-database-spi = { path = "../sdkwork-database/crates/sdkwork-database-spi" }
sdkwork-database-drift = { path = "../sdkwork-database/crates/sdkwork-database-drift" }
sdkwork-database-repository = { path = "../sdkwork-database/crates/sdkwork-database-repository" }
sdkwork-utils-rust = { path = "../sdkwork-utils/packages/sdkwork-utils-rust" }
sdkwork-database-id = { path = "../sdkwork-database/crates/sdkwork-database-id", package = "sdkwork-database-id" }
sdkwork-intelligence-prompts-ai-contract = { path = "../sdkwork-prompts/crates/sdkwork-intelligence-prompts-ai-contract" }

# Local intelligence agents service + HTTP routes (application-owned)
sdkwork-intelligence-agents-service = { path = "crates/sdkwork-intelligence-agents-service", features = ["http-axum", "postgres-sync"] }
cloudrouter-open-sdk = { path = "../sdkwork-cloudrouter/sdks/cloudrouter-open-sdk/cloudrouter-open-sdk-rust/generated/server-openapi" }
sdkwork-routes-agents-http-shared = { path = "crates/sdkwork-routes-agents-http-shared" }
sdkwork-routes-agents-open-api = { path = "crates/sdkwork-routes-agents-open-api" }
sdkwork-routes-agents-app-api = { path = "crates/sdkwork-routes-agents-app-api" }
sdkwork-routes-agents-backend-api = { path = "crates/sdkwork-routes-agents-backend-api" }
sdkwork-agents-contract = { path = "crates/sdkwork-agents-contract" }
sdkwork-agents-runtime-facade = { path = "crates/sdkwork-agents-runtime-facade" }
sdkwork-agents-kernel-bridge = { path = "crates/sdkwork-agents-kernel-bridge" }
sdkwork-agents-database-host = { path = "crates/sdkwork-agents-database-host" }
sdkwork-api-agents-assembly = { path = "crates/sdkwork-api-agents-assembly" }
sdkwork-api-agents-standalone-gateway = { path = "crates/sdkwork-api-agents-standalone-gateway" }
sdkwork-intelligence-agents-worker = { path = "crates/sdkwork-intelligence-agents-worker" }
sdkwork-agents-integration-tests = { path = "crates/sdkwork-agents-integration-tests" }

# Generations dependency (sdkwork-agents composes generations capabilities)
sdkwork-api-generations-assembly = { path = "../sdkwork-generations/crates/sdkwork-api-generations-assembly" }

# Media tool family (application-owned, cloudrouter open-api backed)
sdkwork-agents-tool-contract = { path = "crates/sdkwork-agents-tool-contract" }
sdkwork-agents-tool-cloudrouter = { path = "crates/sdkwork-agents-tool-cloudrouter" }
sdkwork-agents-tool-audio = { path = "crates/sdkwork-agents-tool-audio" }
sdkwork-agents-tool-video = { path = "crates/sdkwork-agents-tool-video" }
sdkwork-agents-tool-music = { path = "crates/sdkwork-agents-tool-music" }
sdkwork-agents-tool-sound-effect = { path = "crates/sdkwork-agents-tool-sound-effect" }
sdkwork-agents-tool-image = { path = "crates/sdkwork-agents-tool-image" }
sdkwork-agents-tool-file = { path = "crates/sdkwork-agents-tool-file" }
sdkwork-agents-tool-intelligence = { path = "crates/sdkwork-agents-tool-intelligence" }
sdkwork-agents-tool-generations = { path = "crates/sdkwork-agents-tool-generations" }

[patch.crates-io]
# Codex app-server-client enables websocket proxy support supplied by these upstream forks.
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
