[package]
name = "sdkwork-agents-runtime-facade"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agents application facade for kernel agent-engine provider bootstrap and runtime execution"

[features]
default = []
# Codex agent provider carries its own embedded SQLite runtime store
# (codex-state). It is an optional, per-application integration: off by
# default so server/container builds stay SQLite-free (DATABASE_SPEC:
# authoritative-server persistence is PostgreSQL only); applications that
# need the Codex engine enable it explicitly, and client-local surfaces
# enable it for device-scoped state.
codex-provider = ["dep:sdkwork-agent-provider-codex"]
# Unit tests exercise the full engine catalog including Codex; Codex stays
# out of production server builds (embedded client-local SQLite runtime
# store), so the tests opt in explicitly (DATABASE_SPEC: authoritative-server
# persistence is PostgreSQL only).
test-codex = ["codex-provider"]

[dependencies]
sdkwork-agent-kernel = { workspace = true }
sdkwork-utils-rust = { workspace = true }
sdkwork-agents-tool-contract = { workspace = true }
sdkwork-agents-tool-cloudrouter = { workspace = true }
sdkwork-agents-tool-audio = { workspace = true }
sdkwork-agents-tool-video = { workspace = true }
sdkwork-agents-tool-music = { workspace = true }
sdkwork-agents-tool-sound-effect = { workspace = true }
sdkwork-agents-tool-image = { workspace = true }
sdkwork-agents-tool-file = { workspace = true }
sdkwork-agents-tool-intelligence = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
roxmltree = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = "0.3"
sdkwork-agent-provider-codex = { workspace = true, optional = true }
sdkwork-agent-provider-claude-code = { workspace = true }
sdkwork-agent-provider-gemini-cli = { workspace = true }
sdkwork-agent-provider-opencode = { workspace = true }
sdkwork-agent-provider-openclaw = { workspace = true }
sdkwork-agent-provider-hermes = { workspace = true }
sdkwork-agent-provider-mimo-code = { workspace = true }
sdkwork-agent-provider-rig = { workspace = true }
sdkwork-agent-provider-spi = { workspace = true }
sdkwork-agent-provider-core = { workspace = true }
