[package]
name = "sdkwork-intelligence-agents-service"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SDKWork intelligence agents domain service (managed agents, marketplace, knowledge registry)"

[features]
default = ["http-axum", "postgres-sync"]
postgres-sync = ["dep:sdkwork-database-config", "dep:sdkwork-database-sqlx", "dep:sqlx", "dep:tokio"]
http-axum = ["dep:axum", "dep:tokio", "dep:tokio-stream", "dep:tower", "dep:sdkwork-web-core"]
# Unit and contract tests exercise the full engine catalog including Codex.
# Codex carries an embedded client-local SQLite runtime store and stays out of
# production server builds; this test-only feature enables its provider so the
# catalog tests can bootstrap every engine (DATABASE_SPEC: authoritative-server
# persistence is PostgreSQL only).
codex-test = ["sdkwork-agents-runtime-facade/codex-provider"]

[lib]
name = "sdkwork_intelligence_agents_service"
path = "src/lib.rs"

[dependencies]
sdkwork-agents-contract.workspace = true
sdkwork-agents-runtime-facade.workspace = true
sdkwork-agents-tool-contract.workspace = true
sdkwork-agents-tool-cloudrouter.workspace = true
sdkwork-agents-tool-audio.workspace = true
sdkwork-agents-tool-video.workspace = true
sdkwork-agents-tool-music.workspace = true
sdkwork-agents-tool-sound-effect.workspace = true
sdkwork-agents-tool-image.workspace = true
sdkwork-agents-tool-file.workspace = true
sdkwork-agents-tool-intelligence.workspace = true
sdkwork-agent-kernel.workspace = true
sdkwork-code-kernel.workspace = true
sdkwork-utils-rust.workspace = true
sdkwork-database-id.workspace = true
sdkwork-intelligence-prompts-ai-contract.workspace = true
cloudrouter-open-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
sdkwork-drive-uploader-service.workspace = true
sdkwork-drive-object-runtime.workspace = true
sdkwork-drive-workspace-service.workspace = true
sdkwork-drive-storage-contract.workspace = true
reqwest.workspace = true
sdkwork-database-config = { workspace = true, optional = true }
sdkwork-database-sqlx = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
axum = { workspace = true, optional = true, features = ["json"] }
tokio = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
sdkwork-web-core = { workspace = true, optional = true }
time.workspace = true
futures-util = "0.3"
chrono.workspace = true
chrono-tz.workspace = true
cron.workspace = true

[dev-dependencies]
async-trait.workspace = true
serde_yaml.workspace = true
sdkwork-agents-database-host.workspace = true

[[test]]
name = "agent_postgres_sync_contracts"
path = "tests/agent_postgres_sync_contracts.rs"
required-features = ["postgres-sync"]
