      x-sdkwork-performance-class: P1
      parameters:
      - $ref: '#/components/parameters/AgentIdPath'
      - $ref: '#/components/parameters/SessionIdPath'
      - name: cursor
        in: query
        required: false
        description: Opaque keyset continuation token returned by pageInfo.nextCursor.
        schema:
          type: string
          minLength: 1
          maxLength: 2048
      - $ref: '#/components/parameters/PageSize'
      - name: kind
        in: query
        required: false
        schema:
