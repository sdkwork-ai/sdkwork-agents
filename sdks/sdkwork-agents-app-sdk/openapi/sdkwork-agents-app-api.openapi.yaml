openapi: 3.1.2
info:
  title: SDKWork Agent Business App API
  version: 6.0.0
  description: App-facing managed agent execution APIs for SDKWork clients.
x-sdkwork-owner: sdkwork-agents
x-sdkwork-api-authority: sdkwork-agents-app-api
x-sdkwork-sdk-family: sdkwork-agents-app-sdk
x-sdkwork-owner-only-input: true
x-sdkwork-standard-version: '2026-06-26'
servers:
- url: http://localhost:8080
tags:
- name: ai
  description: Managed AI agent operations for app clients.
paths:
  /app/v3/api/ai/agents:
    get:
      x-sdkwork-owner: sdkwork-agents
      x-sdkwork-api-authority: sdkwork-agents-app-api
      tags:
      - ai
      summary: List managed agents
      operationId: agents.list
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents
      x-sdkwork-permission: ai.agents.read
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.listed
      parameters:
      - $ref: '#/components/parameters/IncludeDeleted'
      - $ref: '#/components/parameters/ListScope'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/SearchQ'
      responses:
        '200':
          description: Managed agent list response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
        default:
          description: Problem detail response
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      x-sdkwork-owner: sdkwork-agents
      x-sdkwork-api-authority: sdkwork-agents-app-api
      tags:
      - ai
      summary: Create a managed agent
      description: "Any authenticated user can create a managed agent. The agent is\
        \ created\nin `draft` status and must be activated (draft to active) by a user\
        \ with\n`ai.agents.manage` permission, providing the review workflow.\n"
      operationId: agents.create
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents
      x-sdkwork-permission: ai.agents.use
      x-sdkwork-permission-scope: authenticated
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: Created managed agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '403':
          description: Permission denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/permission_required
                title: permission_required
                status: 403
                detail: agent management denied
                code: 40301
                errorCategory: permission
                retryable: false
                traceId: 00000000-0000-0000-0000-000000000000
        '409':
          description: Resource conflict (duplicate agent_id or code within tenant
            scope)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/conflict
                title: conflict
                status: 409
                detail: agent already exists
                code: 40901
                errorCategory: business
                retryable: false
                traceId: 00000000-0000-0000-0000-000000000000
        default:
          description: Problem detail response
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /app/v3/api/ai/agents/{agentId}:
    get:
      x-sdkwork-owner: sdkwork-agents
      x-sdkwork-api-authority: sdkwork-agents-app-api
