  /app/v3/api/ai/projects/{projectId}/sessions/synchronize:
    post:
      x-sdkwork-owner: sdkwork-agents
      x-sdkwork-api-authority: sdkwork-agents-app-api
      tags: [ai]
      summary: Synchronize provider Session inventory for one project
      description: >-
        Explicitly reconciles the project runtime's provider Session inventory.
        The reconciliation runs on a bounded background worker: a request
        inside the 60-second refresh window returns the cached outcome
        (`status=completed`), a cold request enqueues the run and returns
        `202` (`status=accepted`), and a request racing an in-flight run
        returns `202` (`status=pending`). This command never accepts device
        paths, directory names, or local filesystem fingerprints from a
        client. Individual invalid provider records are isolated and reported
        as bounded aggregate issues, so one malformed record does not discard
        valid reconciliation work.
      operationId: agents.projectSessions.synchronize
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents.sessions
      x-sdkwork-permission: ai.agents.use
      x-sdkwork-tenant-scope: organization
      x-sdkwork-audit-event: agent.business.session_inventory_synchronized
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Provider Session inventory synchronization result (refresh-cache hit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSessionSynchronizationResponse'
        '202':
          description: Synchronization accepted for background execution (accepted or pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSessionSynchronizationResponse'
        default:
          description: Problem detail response
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
