        default sort is sequence ascending; use -sequence to fetch the newest items
        first. Cursor tokens are opaque and bound to the authenticated scope,
        Session, filters, and sort order.
      operationId: agents.sessionItems.list
      security:
      - AuthToken: []
        AccessToken: []
