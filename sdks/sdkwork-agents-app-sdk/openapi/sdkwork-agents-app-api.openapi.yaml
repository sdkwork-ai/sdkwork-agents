        AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents
      x-sdkwork-permission: ai.agents.manage
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.updated
      parameters:
      - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: Updated managed agent response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '403':
          description: Permission denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/permission_required
                title: permission_required
                status: 403
                detail: agent management denied
                code: 40301
                errorCategory: permission
                retryable: false
                traceId: 00000000-0000-0000-0000-000000000000
        '404':
          description: Agent not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/not_found
                title: not_found
                status: 404
                detail: agent not found
                code: 40401
                errorCategory: resource
                retryable: false
                traceId: 00000000-0000-0000-0000-000000000000
        '409':
          description: Optimistic concurrency conflict (stale expectedVersion)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/version_conflict
                title: version_conflict
                status: 409
                detail: 'agent version mismatch: expected=2, actual=3'
                code: 40901
                errorCategory: concurrency
                retryable: true
                traceId: 00000000-0000-0000-0000-000000000000
        default:
          description: Problem detail response
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      x-sdkwork-owner: sdkwork-agents
      x-sdkwork-api-authority: sdkwork-agents-app-api
      tags:
      - ai
      summary: Soft-delete one managed agent
      operationId: agents.delete
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents
      x-sdkwork-permission: ai.agents.manage
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.deleted
      parameters:
      - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '204':
          description: Soft-deleted managed agent
        '403':
          description: Permission denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/permission_required
                title: permission_required
                status: 403
                detail: agent management denied
                code: 40301
                errorCategory: permission
                retryable: false
                traceId: 00000000-0000-0000-0000-000000000000
        '404':
          description: Agent not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/not_found
                title: not_found
                status: 404
                detail: agent not found
                code: 40401
                errorCategory: resource
                retryable: false
                traceId: 00000000-0000-0000-0000-000000000000
        '409':
          description: Optimistic concurrency conflict (stale expectedVersion)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/version_conflict
                title: version_conflict
                status: 409
                detail: 'agent version mismatch: expected=2, actual=3'
                code: 40901
                errorCategory: concurrency
                retryable: true
                traceId: 00000000-0000-0000-0000-000000000000
        default:
          description: Problem detail response
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
