components:
  securitySchemes:
    AuthToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AccessToken:
      type: apiKey
      in: header
      name: Access-Token
  parameters:
    WorkspaceIdPath:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^workspace\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
    ProjectIdPath:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^project\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
    IncludeDeleted:
      name: include_deleted
      in: query
      required: false
      schema:
        type: boolean
        default: false
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque, versioned continuation token returned in data.pageInfo.nextCursor.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    StreamQuery:
      name: stream
      in: query
      required: false
      description: When true, returns text/event-stream with one completion event
        instead of JSON.
      schema:
        type: boolean
        default: false
    EventProtocolQuery:
      name: event_protocol
      in: query
      required: false
      description: Selects provider-neutral runtime events for an SSE response. `kernel-v1`
        requires `stream=true`; omit this parameter to preserve the legacy delta/completion
        stream.
      schema:
        type: string
        enum: [kernel-v1]
    SearchQ:
      name: q
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ListScope:
      name: scope
      in: query
      required: false
      description: List scope. Use `market`, `public`, or `published` for tenant-visible
        catalog agents; omit for agents owned by the authenticated user.
      schema:
        type: string
        enum:
        - market
        - public
        - published
        - mine
        - workspace
    AgentIdPath:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^agent\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
    SlotIdPath:
      name: slotId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^slot\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
    TaskIdPath:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^task\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
    RunIdPath:
      name: runId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^run\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^session\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    ItemIdPath:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^item\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    TurnIdPath:
      name: turnId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^turn\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    QueueEntryIdPath:
      name: queueEntryId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^queue-entry\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    InteractionIdPath:
      name: interactionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^interaction\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    CheckpointIdPath:
      name: checkpointId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^checkpoint\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    SessionRuntimeBindingIdPath:
      name: runtimeBindingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^runtime_binding\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    BindingIdPath:
      name: bindingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^binding\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
  schemas:
    MediaToolDirectoryResponse:
      description: Media tool directory following SdkWorkApiResponse envelope;
        the directory is returned as a bare array under data.
      allOf:
      - $ref: '#/components/schemas/SdkWorkApiResponse'
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/MediaToolDirectoryEntry'
    MediaToolInvokeApiResponse:
      description: Media tool invocation result following SdkWorkApiResponse
        envelope.
      allOf:
      - $ref: '#/components/schemas/SdkWorkApiResponse'
      - type: object
        required:
        - data
        properties:
          data:
            $ref: '#/components/schemas/MediaToolInvokeResponse'
    ToolAssetListResponse:
      description: Generated media asset list following SdkWorkApiResponse
        envelope; the list is returned as a bare array under data.
      allOf:
      - $ref: '#/components/schemas/SdkWorkApiResponse'
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/ToolAssetView'
    SdkWorkApiResponse:
      type: object
      additionalProperties: false
      required:
      - code
      - data
      - traceId
      properties:
        code:
          type: integer
          format: int32
          description: Numeric success result code. MUST be 0 on HTTP 2xx JSON bodies.
            See API_SPEC.md 搂15.3.
          enum:
          - 0
          default: 0
          minimum: 0
          maximum: 0
        data:
          description: Operation-specific payload. Typed per operation through allOf
            or explicit schema refs.
        traceId:
          type: string
          format: uuid
          description: Server-owned request correlation id. Clients MUST NOT supply
            this value.
    SdkWorkResourceData:
      type: object
      additionalProperties: false
      required:
      - item
      properties:
        item:
          description: Typed domain resource for the operation.
    SdkWorkPageData:
      type: object
      additionalProperties: false
      required:
      - items
      - pageInfo
      properties:
        items:
          type: array
          items: {}
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    Int64String:
      type: string
      pattern: ^[0-9]+$
    AgentStatus:
      type: string
      enum:
      - draft
      - active
      - disabled
      - archived
      - deleted
    AgentVisibility:
      type: string
      enum:
      - private
      - organization
      - tenant
      - public
    AgentImplementationKind:
      type: string
      enum:
      - manifest-only
      - typed-local-provider
      - process-adapter
      - protocol-adapter
    AgentImplementationType:
      type: string
      enum:
      - sdkwork-native
      - rig-rust
      - openai-agents
      - langchain
      - langgraph
      - crewai
      - autogen
      - semantic-kernel
      - custom
    PageInfo:
      type: object
      additionalProperties: false
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - offset
          - cursor
          description: Pagination mode used by the response.
        page:
          type: integer
          minimum: 1
          description: Current page number when mode is offset.
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
          description: Page size used by the response.
        totalItems:
          $ref: '#/components/schemas/Int64String'
        totalPages:
          type: integer
          minimum: 0
          description: Total pages when mode is offset.
        nextCursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page when mode is cursor.
        hasMore:
          type: boolean
          description: Whether more pages follow the current page.
    AgentRecord:
      type: object
      additionalProperties: false
      required:
      - id
      - agentId
      - tenantId
      - organizationId
      - ownerUserId
      - code
      - displayName
      - manifest
      - implementationType
      - status
      - visibility
      - tags
      - version
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Int64String'
        agentId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^agent\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
        tenantId:
          $ref: '#/components/schemas/Int64String'
        organizationId:
          $ref: '#/components/schemas/Int64String'
        ownerUserId:
          $ref: '#/components/schemas/Int64String'
        code:
          type: string
          minLength: 1
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type:
          - string
          - 'null'
          maxLength: 4096
        manifest:
          type: object
          additionalProperties: true
        defaultCodeTaskIntent:
          type:
          - object
          - 'null'
          additionalProperties: true
        managementProfile:
          oneOf:
          - $ref: '#/components/schemas/AgentManagementProfile'
          - type: 'null'
        implementationProviderId:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
          pattern: ^provider\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
        implementationKind:
          oneOf:
          - $ref: '#/components/schemas/AgentImplementationKind'
          - type: 'null'
        implementationType:
          $ref: '#/components/schemas/AgentImplementationType'
        status:
          $ref: '#/components/schemas/AgentStatus'
        visibility:
          $ref: '#/components/schemas/AgentVisibility'
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 64
        version:
          $ref: '#/components/schemas/Int64String'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type:
          - string
          - 'null'
          format: date-time
    AgentManagementProfile:
      type: object
      additionalProperties: false
      properties:
        author:
          type: string
          minLength: 1
          maxLength: 128
        avatar:
          type: string
          minLength: 1
          maxLength: 512
        categoryId:
          type: string
          minLength: 1
          maxLength: 64
        color:
          type: string
          minLength: 1
          maxLength: 32
        debugMode:
          type: boolean
        iconName:
          type: string
          minLength: 1
          maxLength: 64
        jsonMode:
          type: boolean
        knowledgeBaseIds:
          type: array
          items:
            type: string
