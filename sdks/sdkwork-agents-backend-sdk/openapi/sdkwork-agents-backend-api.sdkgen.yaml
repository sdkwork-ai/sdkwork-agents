  /backend/v3/api/ai/agents/{agentId}/sessions/{sessionId}/items:
    get:
      x-sdkwork-owner: sdkwork-agents
      x-sdkwork-api-authority: sdkwork-agents-backend-api
      tags:
      - ai
      summary: List ordered items for one agent session
      description: P1 interactive keyset list. Supports kind and status filters. The
        default sort is sequence ascending; use -sequence to fetch the newest items
        first.
      operationId: agents.sessionItems.list
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents.sessionItems
      x-sdkwork-permission: agent.business.session_item.list
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-pagination-mode: cursor
      x-sdkwork-performance-class: P1
      parameters:
      - $ref: '#/components/parameters/AgentIdPath'
      - $ref: '#/components/parameters/SessionIdPath'
      - name: cursor
        in: query
        required: false
        description: Opaque keyset continuation token (base64url JSON), scoped to
          this session and filter set.
        schema:
          type: string
          maxLength: 1024
      - $ref: '#/components/parameters/PageSize'
      - name: kind
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AgentSessionItemKind'
      - name: status
        in: query
