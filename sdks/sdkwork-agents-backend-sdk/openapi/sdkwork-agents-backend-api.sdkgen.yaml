components:
  securitySchemes:
    AuthToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AccessToken:
      type: apiKey
      in: header
      name: Access-Token
  parameters:
    IncludeDeleted:
      name: include_deleted
      in: query
      required: false
      schema:
        type: boolean
        default: false
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque, versioned continuation token returned in data.pageInfo.nextCursor.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    StreamQuery:
      name: stream
      in: query
      required: false
      description: When true, returns text/event-stream with one completion event
        instead of JSON.
      schema:
        type: boolean
        default: false
    EventProtocolQuery:
      name: event_protocol
      in: query
      required: false
      description: Selects provider-neutral runtime events for an SSE response. `kernel-v1`
        requires `stream=true`; omit this parameter to preserve the legacy delta/completion
        stream.
      schema:
        type: string
        enum:
        - kernel-v1
    SearchQ:
      name: q
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AgentIdPath:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^agent\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
    SlotIdPath:
      name: slotId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^slot\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
    TaskIdPath:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^task\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
    RunIdPath:
      name: runId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^run\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^session\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
    ItemIdPath:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^item\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
    TurnIdPath:
      name: turnId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^turn\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
    InteractionIdPath:
      name: interactionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^interaction\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
    CheckpointIdPath:
      name: checkpointId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^checkpoint\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
    SessionRuntimeBindingIdPath:
      name: runtimeBindingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^runtime_binding\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
    BindingIdPath:
      name: bindingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^binding\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
    AuditAction:
      name: action
      in: query
      required: false
      description: Filter by audit action.
      schema:
        $ref: '#/components/schemas/AuditAction'
    AuditFrom:
      name: from
      in: query
      required: false
      description: RFC3339 lower-bound timestamp (inclusive).
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      required: false
      description: RFC3339 upper-bound timestamp (inclusive), must be >= from.
      schema:
        type: string
        format: date-time
  responses:
    Problem:
      description: RFC 9457 problem detail response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            ValidationError:
              summary: Validation failure
              value:
                type: https://sdkwork.dev/problems/validation_error
                title: validation_error
                status: 400
                detail: requestedAt must be RFC3339 date-time
                code: 40001
                errorCategory: validation
                retryable: false
                traceId: 00000000-0000-0000-0000-000000000000
            VersionConflict:
              summary: Optimistic concurrency conflict
              value:
                type: https://sdkwork.dev/problems/version_conflict
                title: version_conflict
                status: 409
                detail: 'agent version mismatch: expected=2, actual=3'
                code: 40901
                errorCategory: concurrency
                retryable: true
                traceId: 00000000-0000-0000-0000-000000000000
            PermissionRequired:
              summary: Permission denied
              value:
                type: https://sdkwork.dev/problems/permission_required
                title: permission_required
                status: 403
                detail: agent management denied
                code: 40301
                errorCategory: permission
                retryable: false
                traceId: 00000000-0000-0000-0000-000000000000
            NotFound:
              summary: Resource not found
              value:
                type: https://sdkwork.dev/problems/not_found
                title: not_found
                status: 404
                detail: agent not found
                code: 40401
                errorCategory: resource
                retryable: false
                traceId: 00000000-0000-0000-0000-000000000000
  schemas:
    MediaToolDirectoryResponse:
      description: Media tool directory following SdkWorkApiResponse envelope; the
        directory is returned as a bare array under data.
      allOf:
      - $ref: '#/components/schemas/SdkWorkApiResponse'
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/MediaToolDirectoryEntry'
    ToolDirectoryEntryApiResponse:
      description: Tool directory entry result following SdkWorkApiResponse envelope.
      allOf:
      - $ref: '#/components/schemas/SdkWorkApiResponse'
      - type: object
        required:
        - data
        properties:
          data:
            $ref: '#/components/schemas/MediaToolDirectoryEntry'
    SdkWorkApiResponse:
      type: object
      additionalProperties: false
      required:
      - code
      - data
      - traceId
      properties:
        code:
          type: integer
          format: int32
          description: Numeric success result code. MUST be 0 on HTTP 2xx JSON bodies.
            See API_SPEC.md 搂15.3.
          enum:
          - 0
          default: 0
          minimum: 0
          maximum: 0
        data:
          description: Operation-specific payload. Typed per operation through allOf
            or explicit schema refs.
        traceId:
          type: string
          format: uuid
          description: Server-owned request correlation id. Clients MUST NOT supply
            this value.
    SdkWorkResourceData:
      type: object
      additionalProperties: false
      required:
      - item
      properties:
        item:
          description: Typed domain resource for the operation.
    SdkWorkPageData:
      type: object
      additionalProperties: false
      required:
      - items
      - pageInfo
      properties:
        items:
          type: array
          items: {}
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    Int64String:
      type: string
      pattern: ^[0-9]+$
