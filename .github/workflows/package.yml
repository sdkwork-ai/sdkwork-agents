name: Package Application

on:
  push:
    tags:
      - v*
      - '*.*.*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag or source ref to package.
        required: false
        default: v0.1.0
      package_version:
        description: Package version used in artifact names and manifests.
        required: false
        default: 0.1.0
      platform:
        description: Platform filter.
        required: true
        default: all
      architecture:
        description: CPU architecture filter.
        required: true
        default: all
      profile:
        description: Runtime profile filter.
        required: true
        default: all
      format:
        description: Package format filter.
        required: true
        default: all
      deploy:
        description: Run configured deployment environments after packaging.
        required: true
        default: false
        type: boolean
      sdkwork_app_topology_ref:
        description: sdkwork-app-topology commit/ref.
        required: false
        default: main
      sdkwork_appbase_ref:
        description: sdkwork-appbase commit/ref.
        required: false
        default: main
      sdkwork_assets_ref:
        description: sdkwork-assets commit/ref.
        required: false
        default: main
      sdkwork_cloudrouter_ref:
        description: sdkwork-cloudrouter commit/ref.
        required: false
        default: main
      sdkwork_community_ref:
        description: sdkwork-community commit/ref.
        required: false
        default: main
      sdkwork_core_ref:
        description: sdkwork-core commit/ref.
        required: false
        default: main
      sdkwork_database_ref:
        description: sdkwork-database commit/ref.
        required: false
        default: main
      sdkwork_drive_ref:
        description: sdkwork-drive commit/ref.
        required: false
        default: main
      sdkwork_feeds_ref:
        description: sdkwork-feeds commit/ref.
        required: false
        default: main
      sdkwork_generations_ref:
        description: sdkwork-generations commit/ref.
        required: false
        default: main
      sdkwork_iam_ref:
        description: sdkwork-iam commit/ref.
        required: false
        default: main
      sdkwork_id_ref:
        description: sdkwork-id commit/ref.
        required: false
        default: main
      sdkwork_kernel_ref:
        description: sdkwork-kernel commit/ref.
        required: false
        default: main
      sdkwork_knowledgebase_ref:
        description: sdkwork-knowledgebase commit/ref.
        required: false
        default: main
      sdkwork_membership_ref:
        description: sdkwork-membership commit/ref.
        required: false
        default: main
      sdkwork_memory_ref:
        description: sdkwork-memory commit/ref.
        required: false
        default: main
      sdkwork_models_ref:
        description: sdkwork-models commit/ref.
        required: false
        default: main
      sdkwork_order_ref:
        description: sdkwork-order commit/ref.
        required: false
        default: main
      sdkwork_promotion_ref:
        description: sdkwork-promotion commit/ref.
        required: false
        default: main
      sdkwork_prompts_ref:
        description: sdkwork-prompts commit/ref.
        required: false
        default: main
      sdkwork_sandbox_ref:
        description: sdkwork-sandbox commit/ref.
        required: false
        default: main
      sdkwork_sdk_commons_ref:
        description: sdkwork-sdk-commons commit/ref.
        required: false
        default: main
      sdkwork_skills_ref:
        description: sdkwork-skills commit/ref.
        required: false
        default: main
      sdkwork_ui_ref:
        description: sdkwork-ui commit/ref.
        required: false
        default: main
      sdkwork_utils_ref:
        description: sdkwork-utils commit/ref.
        required: false
        default: main
      sdkwork_voice_ref:
        description: sdkwork-voice commit/ref.
        required: false
        default: main
      sdkwork_web_framework_ref:
        description: sdkwork-web-framework commit/ref.
        required: false
        default: main
      sdkwork_web_framework_ref:
        description: sdkwork-web-framework commit/ref.
        required: false
        default: main
      sdkwork_iam_ref:
        description: sdkwork-iam commit/ref.
        required: false
        default: main
      sdkwork_id_ref:
        description: sdkwork-id commit/ref.
        required: false
        default: main
      sdkwork_database_ref:
        description: sdkwork-database commit/ref.
        required: false
        default: main
      sdkwork_utils_ref:
        description: sdkwork-utils commit/ref.
        required: false
        default: main
      sdkwork_prompts_ref:
        description: sdkwork-prompts commit/ref.
        required: false
        default: main
      sdkwork_sandbox_ref:
        description: sdkwork-sandbox commit/ref.
        required: false
        default: main
      sdkwork_drive_ref:
        description: sdkwork-drive commit/ref.
        required: false
        default: main
      sdkwork_knowledgebase_ref:
        description: sdkwork-knowledgebase commit/ref.
        required: false
        default: main
      sdkwork_app_topology_ref:
        description: sdkwork-app-topology commit/ref.
        required: false
        default: main

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  package:
    uses: sdkwork-ai/sdkwork-github-workflow/.github/workflows/sdkwork-package.yml@b0829529b9277a3da32b90c2d36ff34ff09fa832
    with:
      config_path: sdkwork.workflow.json
      tag: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
      package_version: ${{ github.event.inputs.package_version || '' }}
      platform: ${{ github.event.inputs.platform || 'all' }}
      architecture: ${{ github.event.inputs.architecture || 'all' }}
      profile: ${{ github.event.inputs.profile || 'all' }}
      format: ${{ github.event.inputs.format || 'all' }}
      publish_release: true
      upload_artifact: true
      deploy: ${{ github.event.inputs.deploy == 'true' || github.event_name == 'release' }}
      retention_days: 30
      framework_ref: b0829529b9277a3da32b90c2d36ff34ff09fa832
      dependency_refs_json: >-
        {
          "SDKWORK_APP_TOPOLOGY_REF": "${{ github.event.inputs.sdkwork_app_topology_ref || vars.SDKWORK_APP_TOPOLOGY_REF }}",
          "SDKWORK_APPBASE_REF": "${{ github.event.inputs.sdkwork_appbase_ref || vars.SDKWORK_APPBASE_REF }}",
          "SDKWORK_ASSETS_REF": "${{ github.event.inputs.sdkwork_assets_ref || vars.SDKWORK_ASSETS_REF }}",
          "SDKWORK_CLOUDROUTER_REF": "${{ github.event.inputs.sdkwork_cloudrouter_ref || vars.SDKWORK_CLOUDROUTER_REF }}",
          "SDKWORK_COMMUNITY_REF": "${{ github.event.inputs.sdkwork_community_ref || vars.SDKWORK_COMMUNITY_REF }}",
          "SDKWORK_CORE_REF": "${{ github.event.inputs.sdkwork_core_ref || vars.SDKWORK_CORE_REF }}",
          "SDKWORK_DATABASE_REF": "${{ github.event.inputs.sdkwork_database_ref || vars.SDKWORK_DATABASE_REF }}",
          "SDKWORK_DRIVE_REF": "${{ github.event.inputs.sdkwork_drive_ref || vars.SDKWORK_DRIVE_REF }}",
          "SDKWORK_FEEDS_REF": "${{ github.event.inputs.sdkwork_feeds_ref || vars.SDKWORK_FEEDS_REF }}",
          "SDKWORK_GENERATIONS_REF": "${{ github.event.inputs.sdkwork_generations_ref || vars.SDKWORK_GENERATIONS_REF }}",
          "SDKWORK_IAM_REF": "${{ github.event.inputs.sdkwork_iam_ref || vars.SDKWORK_IAM_REF }}",
          "SDKWORK_ID_REF": "${{ github.event.inputs.sdkwork_id_ref || vars.SDKWORK_ID_REF }}",
          "SDKWORK_KERNEL_REF": "${{ github.event.inputs.sdkwork_kernel_ref || vars.SDKWORK_KERNEL_REF }}",
          "SDKWORK_KNOWLEDGEBASE_REF": "${{ github.event.inputs.sdkwork_knowledgebase_ref || vars.SDKWORK_KNOWLEDGEBASE_REF }}",
          "SDKWORK_MEMBERSHIP_REF": "${{ github.event.inputs.sdkwork_membership_ref || vars.SDKWORK_MEMBERSHIP_REF }}",
          "SDKWORK_MEMORY_REF": "${{ github.event.inputs.sdkwork_memory_ref || vars.SDKWORK_MEMORY_REF }}",
          "SDKWORK_MODELS_REF": "${{ github.event.inputs.sdkwork_models_ref || vars.SDKWORK_MODELS_REF }}",
          "SDKWORK_ORDER_REF": "${{ github.event.inputs.sdkwork_order_ref || vars.SDKWORK_ORDER_REF }}",
          "SDKWORK_PROMOTION_REF": "${{ github.event.inputs.sdkwork_promotion_ref || vars.SDKWORK_PROMOTION_REF }}",
          "SDKWORK_PROMPTS_REF": "${{ github.event.inputs.sdkwork_prompts_ref || vars.SDKWORK_PROMPTS_REF }}",
          "SDKWORK_SANDBOX_REF": "${{ github.event.inputs.sdkwork_sandbox_ref || vars.SDKWORK_SANDBOX_REF }}",
          "SDKWORK_SDK_COMMONS_REF": "${{ github.event.inputs.sdkwork_sdk_commons_ref || vars.SDKWORK_SDK_COMMONS_REF }}",
          "SDKWORK_SKILLS_REF": "${{ github.event.inputs.sdkwork_skills_ref || vars.SDKWORK_SKILLS_REF }}",
          "SDKWORK_UI_REF": "${{ github.event.inputs.sdkwork_ui_ref || vars.SDKWORK_UI_REF }}",
          "SDKWORK_UTILS_REF": "${{ github.event.inputs.sdkwork_utils_ref || vars.SDKWORK_UTILS_REF }}",
          "SDKWORK_VOICE_REF": "${{ github.event.inputs.sdkwork_voice_ref || vars.SDKWORK_VOICE_REF }}",
          "SDKWORK_WEB_FRAMEWORK_REF": "${{ github.event.inputs.sdkwork_web_framework_ref || vars.SDKWORK_WEB_FRAMEWORK_REF }}",
        }
    secrets: inherit
