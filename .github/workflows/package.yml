name: Package Application

on:
  push:
    tags:
      - v*
      - '*.*.*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag or source ref to package.
        required: true
        default: v0.1.0
      package_version:
        description: Package version used in artifact names and manifests.
        required: true
        default: 0.1.0
      deployment_profile:
        description: Deployment profile filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - standalone
          - cloud
      runtime_target:
        description: Runtime target filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - browser
          - desktop
          - tablet-ipados
          - tablet-android
          - capacitor-ios
          - capacitor-android
          - flutter-ios
          - flutter-android
          - android-native
          - ios-native
          - harmony-native
          - mini-program
          - server
          - container
          - test-runner
      platform:
        description: Platform filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
          - android
          - android-tablet
          - ios
          - ipados
          - windows-tablet
          - web
          - h5
          - h5-weixin
          - harmony
          - container
          - mp-weixin
      architecture:
        description: Architecture filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - x64
          - arm64
          - armv7
          - universal
          - wasm32
          - noarch
      profile:
        description: Package profile filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - browser
          - server
          - desktop
          - mobile
          - tablet
          - mini-program
          - container
          - worker
          - library
          - test
      variant:
        description: Package variant filter.
        required: true
        default: all
      format:
        description: Package format filter.
        required: true
        default: all
      deploy:
        description: Run configured deployment environments after packaging.
        required: true
        default: false
        type: boolean

      sdkwork_app_topology_ref:
        description: 'SDKWORK_APP_TOPOLOGY_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_appbase_ref:
        description: 'SDKWORK_APPBASE_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_assets_ref:
        description: 'SDKWORK_ASSETS_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_cloudrouter_ref:
        description: 'SDKWORK_CLOUDROUTER_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_community_ref:
        description: 'SDKWORK_COMMUNITY_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_core_ref:
        description: 'SDKWORK_CORE_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_database_ref:
        description: 'SDKWORK_DATABASE_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_drive_ref:
        description: 'SDKWORK_DRIVE_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_feeds_ref:
        description: 'SDKWORK_FEEDS_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_generations_ref:
        description: 'SDKWORK_GENERATIONS_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_iam_ref:
        description: 'SDKWORK_IAM_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_id_ref:
        description: 'SDKWORK_ID_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_kernel_ref:
        description: 'SDKWORK_KERNEL_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_knowledgebase_ref:
        description: 'SDKWORK_KNOWLEDGEBASE_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_membership_ref:
        description: 'SDKWORK_MEMBERSHIP_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_memory_ref:
        description: 'SDKWORK_MEMORY_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_models_ref:
        description: 'SDKWORK_MODELS_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_order_ref:
        description: 'SDKWORK_ORDER_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_promotion_ref:
        description: 'SDKWORK_PROMOTION_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_prompts_ref:
        description: 'SDKWORK_PROMPTS_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_sandbox_ref:
        description: 'SDKWORK_SANDBOX_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_sdk_commons_ref:
        description: 'SDKWORK_SDK_COMMONS_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_skills_ref:
        description: 'SDKWORK_SKILLS_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_ui_ref:
        description: 'SDKWORK_UI_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_utils_ref:
        description: 'SDKWORK_UTILS_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_voice_ref:
        description: 'SDKWORK_VOICE_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_web_framework_ref:
        description: 'SDKWORK_WEB_FRAMEWORK_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  package:
    uses: sdkwork-ai/sdkwork-github-workflow/.github/workflows/sdkwork-package.yml@b0829529b9277a3da32b90c2d36ff34ff09fa832
    with:
      config_path: agent.workflow.json
      tag: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
      package_version: ${{ github.event.inputs.package_version || github.event.release.tag_name || github.ref_name }}
      deployment_profile: ${{ github.event.inputs.deployment_profile || 'all' }}
      runtime_target: ${{ github.event.inputs.runtime_target || 'all' }}
      platform: ${{ github.event.inputs.platform || 'all' }}
      architecture: ${{ github.event.inputs.architecture || 'all' }}
      profile: ${{ github.event.inputs.profile || 'all' }}
      variant: ${{ github.event.inputs.variant || 'all' }}
      format: ${{ github.event.inputs.format || 'all' }}
      publish_release: true
      upload_artifact: true
      deploy: ${{ github.event.inputs.deploy == 'true' || github.event_name == 'release' }}
      retention_days: 30
      framework_ref: b0829529b9277a3da32b90c2d36ff34ff09fa832
      dependency_refs_json: >-
        {
                    "SDKWORK_APP_TOPOLOGY_REF": "${{ github.event.inputs.sdkwork_app_topology_ref || vars.SDKWORK_APP_TOPOLOGY_REF }}",
                    "SDKWORK_APPBASE_REF": "${{ github.event.inputs.sdkwork_appbase_ref || vars.SDKWORK_APPBASE_REF }}",
                    "SDKWORK_ASSETS_REF": "${{ github.event.inputs.sdkwork_assets_ref || vars.SDKWORK_ASSETS_REF }}",
                    "SDKWORK_CLOUDROUTER_REF": "${{ github.event.inputs.sdkwork_cloudrouter_ref || vars.SDKWORK_CLOUDROUTER_REF }}",
                    "SDKWORK_COMMUNITY_REF": "${{ github.event.inputs.sdkwork_community_ref || vars.SDKWORK_COMMUNITY_REF }}",
                    "SDKWORK_CORE_REF": "${{ github.event.inputs.sdkwork_core_ref || vars.SDKWORK_CORE_REF }}",
                    "SDKWORK_DATABASE_REF": "${{ github.event.inputs.sdkwork_database_ref || vars.SDKWORK_DATABASE_REF }}",
                    "SDKWORK_DRIVE_REF": "${{ github.event.inputs.sdkwork_drive_ref || vars.SDKWORK_DRIVE_REF }}",
                    "SDKWORK_FEEDS_REF": "${{ github.event.inputs.sdkwork_feeds_ref || vars.SDKWORK_FEEDS_REF }}",
                    "SDKWORK_GENERATIONS_REF": "${{ github.event.inputs.sdkwork_generations_ref || vars.SDKWORK_GENERATIONS_REF }}",
                    "SDKWORK_IAM_REF": "${{ github.event.inputs.sdkwork_iam_ref || vars.SDKWORK_IAM_REF }}",
                    "SDKWORK_ID_REF": "${{ github.event.inputs.sdkwork_id_ref || vars.SDKWORK_ID_REF }}",
                    "SDKWORK_KERNEL_REF": "${{ github.event.inputs.sdkwork_kernel_ref || vars.SDKWORK_KERNEL_REF }}",
                    "SDKWORK_KNOWLEDGEBASE_REF": "${{ github.event.inputs.sdkwork_knowledgebase_ref || vars.SDKWORK_KNOWLEDGEBASE_REF }}",
                    "SDKWORK_MEMBERSHIP_REF": "${{ github.event.inputs.sdkwork_membership_ref || vars.SDKWORK_MEMBERSHIP_REF }}",
                    "SDKWORK_MEMORY_REF": "${{ github.event.inputs.sdkwork_memory_ref || vars.SDKWORK_MEMORY_REF }}",
                    "SDKWORK_MODELS_REF": "${{ github.event.inputs.sdkwork_models_ref || vars.SDKWORK_MODELS_REF }}",
                    "SDKWORK_ORDER_REF": "${{ github.event.inputs.sdkwork_order_ref || vars.SDKWORK_ORDER_REF }}",
                    "SDKWORK_PROMOTION_REF": "${{ github.event.inputs.sdkwork_promotion_ref || vars.SDKWORK_PROMOTION_REF }}",
                    "SDKWORK_PROMPTS_REF": "${{ github.event.inputs.sdkwork_prompts_ref || vars.SDKWORK_PROMPTS_REF }}",
                    "SDKWORK_SANDBOX_REF": "${{ github.event.inputs.sdkwork_sandbox_ref || vars.SDKWORK_SANDBOX_REF }}",
                    "SDKWORK_SDK_COMMONS_REF": "${{ github.event.inputs.sdkwork_sdk_commons_ref || vars.SDKWORK_SDK_COMMONS_REF }}",
                    "SDKWORK_SKILLS_REF": "${{ github.event.inputs.sdkwork_skills_ref || vars.SDKWORK_SKILLS_REF }}",
                    "SDKWORK_UI_REF": "${{ github.event.inputs.sdkwork_ui_ref || vars.SDKWORK_UI_REF }}",
                    "SDKWORK_UTILS_REF": "${{ github.event.inputs.sdkwork_utils_ref || vars.SDKWORK_UTILS_REF }}",
                    "SDKWORK_VOICE_REF": "${{ github.event.inputs.sdkwork_voice_ref || vars.SDKWORK_VOICE_REF }}",
                    "SDKWORK_WEB_FRAMEWORK_REF": "${{ github.event.inputs.sdkwork_web_framework_ref || vars.SDKWORK_WEB_FRAMEWORK_REF }}"
        }
    secrets: inherit
